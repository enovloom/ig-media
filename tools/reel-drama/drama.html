<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'NSJ'; font-weight: 500; src: url('fonts/NotoSansJP-500.ttf'); }
  @font-face { font-family: 'NSJ'; font-weight: 700; src: url('fonts/NotoSansJP-700.ttf'); }
  @font-face { font-family: 'NSJ'; font-weight: 900; src: url('fonts/NotoSansJP-900.ttf'); }
  :root { --ink: #1f2a37; --yellow: #fbe55f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'NSJ', 'Noto Color Emoji', sans-serif; position: relative; }
  body.end {
    background:
      radial-gradient(circle at 12% 22%, rgba(255,255,255,0.09), transparent 38%),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,0.07), transparent 42%),
      linear-gradient(180deg, #2c2b69 0%, #4a2f73 40%, #8a3778 75%, #b63c78 100%);
  }
  .part { display: none; }
  .shade-top { position: absolute; left: 0; right: 0; top: 0; height: 560px; background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0)); }
  .shade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 820px; background: linear-gradient(0deg, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
  .label { position: absolute; left: 64px; top: 230px; font-weight: 700; font-size: 30px; color: rgba(255,255,255,0.88); text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .label .sep { display: inline-block; margin: 0 10px; color: rgba(255,255,255,0.5); font-weight: 500; }

  .hook { position: absolute; left: 56px; top: 292px; }
  .hook .l1 { font-weight: 900; font-size: 76px; line-height: 1.12; color: #fff; padding-left: 8px; text-shadow: 0 3px 14px rgba(0,0,0,0.55); white-space: nowrap; }
  .hook .l2 { display: inline-block; margin-top: 6px; font-weight: 900; font-size: 76px; line-height: 1.08; color: var(--ink); background: var(--yellow); border-radius: 12px; padding: 0 12px; white-space: nowrap; }

  .sub { position: absolute; left: 60px; right: 60px; top: 1300px; text-align: center; }
  .sub.upper { top: 960px; }
  .sub .who { display: inline-block; font-weight: 900; font-size: 30px; color: #fff; padding: 6px 22px; border-radius: 999px; margin-bottom: 18px; }
  .sub .who.other { background: #d6457d; }
  .sub .who.manager { background: #3d6fd6; }
  .sub .who.accent { background: #e0313d; font-size: 34px; }
  .sub .text { font-weight: 900; font-size: 58px; line-height: 1.45; color: #fff; white-space: pre-line;
    -webkit-text-stroke: 12px rgba(20,20,30,0.9); paint-order: stroke fill; text-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  .sub .text.inner { color: #dfe6ff; font-weight: 700; }
  .sub .text.accent { color: var(--yellow); font-size: 66px; }
  .card { position: absolute; left: 60px; right: 60px; top: 880px; text-align: center; }
  .card span { display: inline-block; font-weight: 900; font-size: 58px; line-height: 1.45; color: #fff; padding: 22px 48px; background: rgba(10,10,20,0.6); border-radius: 16px; white-space: pre-line; }
  .card span.short { font-size: 64px; letter-spacing: 12px; padding: 18px 60px 18px 72px; }

  .endcard { position: absolute; left: 80px; right: 60px; top: 600px; }
  .endcard .e1 { font-weight: 900; font-size: 78px; line-height: 1.15; color: #fff; white-space: nowrap; }
  .endcard .e2 { display: inline-block; margin-top: 8px; font-weight: 900; font-size: 78px; line-height: 1.1; color: var(--ink); background: var(--yellow); border-radius: 12px; padding: 0 12px; margin-left: -12px; white-space: nowrap; }
  .endcard .q { margin-top: 150px; font-weight: 700; font-size: 44px; line-height: 1.6; color: #fff; white-space: pre-line; }
  .endcard .cta { display: inline-block; margin-top: 70px; background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 42px; padding: 34px 56px; border-radius: 999px; }
  .endcard .n1 { margin-top: 44px; font-weight: 700; font-size: 34px; color: rgba(255,255,255,0.8); }
  .endcard .n2 { margin-top: 14px; font-weight: 500; font-size: 26px; color: rgba(255,255,255,0.65); }
</style>
</head>
<body>
  <div class="part frame"><div class="shade-top"></div><div class="shade-bottom"></div><div class="label" id="label"></div></div>
  <div class="part hook" id="hook"><div class="l1"></div><div class="l2"></div></div>
  <div class="part sub" id="sub"><div class="who"></div><div><span class="text"></span></div></div>
  <div class="part card" id="card"><span></span></div>
  <div class="part endcard" id="end">
    <div class="e1"></div><div class="e2"></div>
    <div class="q"></div>
    <div class="cta"></div>
    <div class="n1"></div><div class="n2"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);

  // Text that runs off the frame or under the edges; drama.js reports these as warnings.
  function overflow() {
    const bad = [];
    for (const el of document.querySelectorAll('.part *')) {
      if (!el.offsetParent || !el.textContent.trim() || el.children.length) continue;
      const r = el.getBoundingClientRect();
      if (r.left < 24 || r.right > 1056 || r.bottom > 1900) bad.push(el.textContent.trim().slice(0, 30));
    }
    return bad;
  }

  // Shows one overlay layer: 'frame', 'hook', a subtitle ({ who, tag, text, pos, tone }) or 'end'.
  function show(ep, layer) {
    document.body.className = layer === 'end' ? 'end' : '';
    for (const p of document.querySelectorAll('.part')) p.style.display = 'none';
    for (const s of document.querySelectorAll('.shade-top, .shade-bottom')) s.style.display = '';
    $('label').innerHTML = 'enovloom<span class="sep">|</span>' + ep.label;
    if (layer === 'frame') {
      document.querySelector('.frame').style.display = 'block';
    } else if (layer === 'hook') {
      $('hook').querySelector('.l1').textContent = ep.hook.lines.length > 1 ? ep.hook.lines[0] : '';
      $('hook').querySelector('.l2').textContent = ep.hook.lines[ep.hook.lines.length - 1];
      $('hook').style.display = 'block';
    } else if (layer === 'end') {
      const e = $('end'), E = ep.end;
      e.querySelector('.e1').textContent = E.title[0];
      e.querySelector('.e2').textContent = E.title[1];
      // parts an episode leaves out are hidden, so the end card can carry a single call to action
      for (const [cls, v] of [['q', E.question], ['cta', E.cta], ['n1', E.note1], ['n2', E.note2]]) {
        const el = e.querySelector('.' + cls);
        el.textContent = v || '';
        el.style.display = v ? '' : 'none';
      }
      document.querySelector('.frame').style.display = 'block';
      document.querySelector('.shade-top').style.display = 'none';
      document.querySelector('.shade-bottom').style.display = 'none';
      e.style.display = 'block';
    } else if (!layer.who && !layer.tag) {
      // a line with no speaker is a card in the middle, such as 翌朝
      const span = $('card').querySelector('span');
      span.textContent = layer.text;
      span.className = layer.text.length <= 4 ? 'short' : '';
      $('card').style.display = 'block';
    } else {
      // tag marks the two layers of 建前と本音; 本音 (or tone "accent") is the punchline style
      const accent = layer.tone === 'accent' || layer.tag === '本音';
      const who = $('sub').querySelector('.who'), text = $('sub').querySelector('.text');
      who.textContent = (layer.who || '') + (layer.who && layer.tag ? 'の' : '') + (layer.tag || '');
      who.className = 'who ' + (accent ? 'accent' : layer.who === '店長' ? 'manager' : 'other');
      text.textContent = layer.text;
      text.className = 'text' + (accent ? ' accent' : layer.text.startsWith('（') ? ' inner' : '');
      $('sub').className = 'part sub' + (layer.pos === 'upper' ? ' upper' : '');
      $('sub').style.display = 'block';
    }
  }
</script>
</body>
</html>
