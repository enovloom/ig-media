<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>reel template</title>
<!--
  Chat-style reel, 1080x1920. render.mjs calls setup(spec) once, then renderAt(t) per frame.
  Everything is positioned from t (no CSS transitions), so any frame can be rendered on its own.
  Layout keeps text inside Instagram's safe area: below the top bar (y > 240), above the
  caption overlay (y < 1420), and left of the button column (x < 930).
-->
<style>
  @font-face { font-family: "NotoJP"; src: url("fonts/NotoSansJP.ttf") format("truetype"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "NotoJP", "Noto Color Emoji", sans-serif; color: #fff; position: relative;
    background: linear-gradient(180deg, #221c48 0%, #36235f 32%, #6e2b6c 70%, #a8396b 100%);
  }
  #glow { position: absolute; left: -260px; top: 120px; width: 1000px; height: 1000px;
    background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,0) 62%); }
  #brand { position: absolute; left: 72px; top: 262px; font-size: 30px; font-weight: 700; opacity: .85; }
  #hook { position: absolute; left: 72px; top: 312px; width: 900px; font-weight: 900; line-height: 1.24; }
  .hl { background: #ffe14d; color: #1f1a3a; padding: 0 12px; border-radius: 8px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #card { position: absolute; left: 60px; top: 600px; width: 860px; height: 760px; background: #dde5ee;
    border-radius: 30px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  #head { height: 96px; background: #fff; display: flex; align-items: center; padding: 0 30px;
    font-size: 34px; font-weight: 700; color: #222; }
  #head .back { color: #666; margin-right: 22px; }
  #head svg { margin-left: auto; }
  .stream { position: absolute; left: 0; right: 0; top: 96px; padding: 30px 26px 0; }
  .row { display: flex; align-items: flex-end; margin-bottom: 24px; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 600px; font-size: 38px; line-height: 1.45; font-weight: 700; padding: 18px 26px;
    border-radius: 28px; white-space: pre-wrap; word-break: break-all; }
  .me .bubble { background: #f8a983; color: #2b1d17; border-bottom-right-radius: 8px; }
  .them .bubble { background: #fff; color: #1f2430; border-bottom-left-radius: 8px; }
  .read { font-size: 22px; color: #7b8494; margin: 0 12px 8px 0; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: #ffc56b; color: #5a3b00; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; margin-right: 14px; }
  .divider { display: flex; justify-content: center; margin: 4px 0 24px; }
  .divider span { background: #c3ccd8; color: #4a5568; font-size: 26px; font-weight: 700; padding: 6px 24px; border-radius: 30px; }
  .dots { display: flex; gap: 10px; padding: 8px 4px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: #9aa3b2; display: block; }
  .stamp { display: flex; justify-content: center; margin: 8px 0 26px; }
  .stamp span { color: #fff; font-size: 46px; font-weight: 900; padding: 14px 36px; border-radius: 16px; }
  .stamp.ng span { background: #e5394d; box-shadow: 0 10px 26px rgba(229,57,77,.45); }
  .stamp.ok span { background: #17a576; box-shadow: 0 10px 26px rgba(23,165,118,.40); }
  #outro { position: absolute; left: 72px; top: 330px; width: 880px; }
  #outro .title { font-weight: 900; line-height: 1.26; }
  #outro .q { margin-top: 64px; font-size: 42px; font-weight: 700; line-height: 1.55; white-space: pre-wrap; }
  #outro .cta { margin-top: 60px; display: inline-block; background: #ffe14d; color: #1f1a3a; font-size: 42px;
    font-weight: 900; padding: 24px 46px; border-radius: 70px; }
  #outro .save { margin-top: 36px; font-size: 32px; font-weight: 700; opacity: .9; }
  #note { position: absolute; left: 72px; top: 1380px; font-size: 24px; opacity: .7; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="brand"></div>
<div id="hook"></div>
<div id="card">
  <div id="head"><span class="back">‹</span><span id="title"></span>
    <svg width="36" height="36" viewBox="0 0 24 24"><path fill="#e0336b" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
  </div>
  <div class="stream" id="s1"></div>
  <div class="stream" id="s2"></div>
</div>
<div id="outro"></div>
<div id="note"></div>
<script>
(() => {
  const items = [];        // { node, start, end, kind, stream }
  const events = [];       // sound cues for render.mjs
  let tFix = 0, tOutro = 0, total = 0;
  const POP = 0.22, FADE = 0.35;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // *text* marks the highlighted part of a line
  const hl = line => esc(line).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>');
  const plain = s => String(s).replace(/\*/g, '');
  // visual width in full-width characters (ASCII counts a bit over half)
  const width = s => [...plain(s)].reduce((n, c) => n + (c.charCodeAt(0) < 0x2000 ? 0.56 : 1), 0);
  const readSec = s => plain(s).replace(/\s/g, '').length / 9;   // about 9 Japanese characters a second
  const div = (cls, html) => { const d = document.createElement('div'); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; };
  const ease = p => 1 - Math.pow(1 - p, 3);
  const clamp = p => Math.max(0, Math.min(1, p));

  function bubbleRow(m, avatarText) {
    if (m.who === 'divider') return div('divider', `<span>${esc(m.text)}</span>`);
    const row = div('row ' + (m.who === 'me' ? 'me' : 'them'));
    if (m.who === 'me') row.append(div('read', '既読'));
    else row.append(div('avatar', esc(avatarText)));
    row.append(div('bubble', esc(m.text)));
    return row;
  }
  function typingRow(avatarText) {
    const row = div('row them');
    row.append(div('avatar', esc(avatarText)));
    row.append(div('bubble', '<div class="dots"><i></i><i></i><i></i></div>'));
    return row;
  }
  function add(node, stream, start, kind, end = Infinity) {
    node.style.display = 'none';
    stream.append(node);
    items.push({ node, stream, start, end, kind });
    return node;
  }

  window.setup = spec => {
    document.getElementById('brand').textContent = spec.brand || '';
    const hook = document.getElementById('hook');
    const hookW = Math.max(...spec.hook.map(width));
    hook.style.fontSize = Math.min(82, Math.floor(900 / hookW)) + 'px';
    hook.innerHTML = spec.hook.map(hl).join('<br>');
    document.getElementById('title').textContent = spec.chat.title;
    document.getElementById('note').textContent = spec.note ?? '※よくある場面をもとにした会話例です';
    const avatarText = spec.chat.avatar || [...plain(spec.chat.title)][0] || '';
    const s1 = document.getElementById('s1'), s2 = document.getElementById('s2');

    // problem: the first two lines are on screen from the first frame, so the scroll stops on the conflict
    const problem = spec.chat.problem, ngAfter = Math.min(spec.chat.ngAfter ?? 2, problem.length);
    let t = 0, readBacklog = 0;
    problem.forEach((m, i) => {
      if (i === 0) t = -1;                      // fully visible at t = 0
      else if (i === 1) t = Math.max(t, 0.45);
      else {
        if (m.who === 'them') { add(typingRow(avatarText), s1, t, 'fade', t + 0.7); t += 0.7; }
        else t += 0.25;
      }
      add(bubbleRow(m, avatarText), s1, t, 'pop');
      if (i > 0) events.push({ t, type: 'pop' });
      readBacklog += readSec(m.text);
      if (i + 1 === ngAfter) {
        t = Math.max(t + 0.6, 1.1);
        add(div('stamp ng', `<span>✕ ${esc(spec.chat.ng)}</span>`), s1, t, 'stamp');
        events.push({ t, type: 'stamp' });
        t += 0.4;
      } else if (i > 0) {
        t += 0.5 + (i >= ngAfter ? readSec(m.text) : 0);
      }
    });
    // give people time to read what is on screen before the answer starts
    tFix = Math.max(t + 1.6, readBacklog + 1.8);
    events.push({ t: tFix, type: 'whoosh' });

    // fix: a fresh chat with the better reply
    t = tFix + FADE;
    add(div('stamp ok', `<span>◯ ${esc(spec.chat.fixLabel || 'こう返す')}</span>`), s2, t, 'stamp');
    events.push({ t, type: 'pop' });
    t += 0.7;
    spec.chat.fix.forEach((m, i) => {
      if (i > 0 && m.who === 'them') { add(typingRow(avatarText), s2, t, 'fade', t + 0.7); t += 0.7; }
      add(bubbleRow(m, avatarText), s2, t, 'pop');
      events.push({ t, type: 'pop' });
      t += 0.6 + readSec(m.text);
    });
    tOutro = t + 0.9;
    events.push({ t: tOutro, type: 'whoosh' });

    // outro: the takeaway and the call to action
    const o = spec.outro, outro = document.getElementById('outro');
    const titleW = Math.max(...o.title.map(width));
    const title = div('title', o.title.map(hl).join('<br>'));
    title.style.fontSize = Math.min(92, Math.floor(880 / titleW)) + 'px';
    const parts = [[title, 0.0]];
    if (o.question) parts.push([div('q', esc(o.question)), 0.6]);
    if (o.cta) parts.push([div('cta', esc(o.cta)), 1.1]);
    if (o.save) parts.push([div('save', esc(o.save)), 1.5]);
    parts.forEach(([node, d]) => add(node, outro, tOutro + FADE + d, 'rise'));
    const outroRead = o.title.map(readSec).reduce((a, b) => a + b, 0) + readSec(o.question || '') + 1.5;
    total = +(tOutro + FADE + Math.max(4.5, outroRead)).toFixed(2);
    // the first frame where the red stamp has fully landed makes a good cover
    const stamp = items.find(x => x.kind === 'stamp');
    return { total, tFix, tOutro, coverMs: Math.round((stamp.start + 0.45) * 1000), events };
  };

  window.renderAt = t => {
    let moving = false;
    const vis = [];
    for (const it of items) {
      const shown = t >= it.start && t < it.end;
      it.node.style.display = shown ? '' : 'none';
      if (!shown) continue;
      vis.push(items.indexOf(it));
      const dur = it.kind === 'rise' ? 0.45 : it.kind === 'stamp' ? 0.3 : POP;
      const p = clamp((t - it.start) / dur), e = ease(p);
      if (p < 1) moving = true;
      if (it.kind === 'pop') { it.node.style.opacity = e; it.node.style.transform = `translateY(${(1 - e) * 24}px) scale(${0.9 + 0.1 * e})`; }
      else if (it.kind === 'stamp') { const s = 1.6 - 0.6 * e; it.node.style.opacity = e; it.node.style.transform = `scale(${s}) rotate(${-4 * e}deg)`; }
      else if (it.kind === 'rise') { it.node.style.opacity = e; it.node.style.transform = `translateY(${(1 - e) * 40}px)`; }
      else if (it.kind === 'fade') {
        it.node.style.opacity = e;
        it.node.querySelectorAll('.dots i').forEach((dot, k) => { dot.style.opacity = 0.35 + 0.65 * Math.max(0, Math.sin((t * 6) - k * 0.9)); });
        moving = true;
      }
    }
    // phase visibility
    const p1 = 1 - clamp((t - tFix) / FADE), p2 = clamp((t - tFix) / FADE), p3 = 1 - clamp((t - tOutro) / FADE);
    if ((t > tFix && t < tFix + FADE) || (t > tOutro && t < tOutro + FADE)) moving = true;
    document.getElementById('s1').style.opacity = p1;
    document.getElementById('s2').style.opacity = p2;
    for (const id of ['hook', 'card', 'note']) document.getElementById(id).style.opacity = p3;
    document.getElementById('outro').style.opacity = t >= tOutro ? 1 : 0;
    // the card grows with the conversation (no big empty chat on the first frame),
    // and once it is full the newest line stays in view
    const s1 = document.getElementById('s1'), s2 = document.getElementById('s2');
    const content = Math.max(p1 > 0 ? s1.scrollHeight : 0, p2 > 0 ? s2.scrollHeight : 0);
    const cardH = Math.max(420, Math.min(760, 96 + content + 6));
    document.getElementById('card').style.height = cardH + 'px';
    document.getElementById('note').style.top = (600 + cardH + 20) + 'px';
    for (const s of [s1, s2]) s.style.transform = `translateY(${-Math.max(0, s.scrollHeight - (cardH - 96 - 6))}px)`;
    // identical keys mean identical frames, so render.mjs can reuse the last screenshot
    return moving ? 't' + t : 'v' + vis.join(',') + (t >= tOutro ? 'o' : '');
  };
})();
</script>
</body>
</html>
