name: insights

# Read-only: collects account and post numbers for analysis. Results are printed
# encrypted (see cloud/insights.sh), because this repository and its logs are public.
on:
  push:
    branches: [claude/instagram-analysis-fmnhog]
    paths: ['cloud/insights.sh', 'cloud/insights.pub.pem', 'cloud/insights.run', '.github/workflows/insights.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # skip the media files; only the scripts are needed
          sparse-checkout: |
            cloud
            insights
          filter: blob:none
      - name: Fetch insights
        env:
          # a separate short-lived token for analysis wins when present, so autopost's token never has to change
          IG_PAGE_TOKEN: ${{ secrets.IG_INSIGHTS_TOKEN || secrets.IG_PAGE_TOKEN }}
          TOKEN_SOURCE: ${{ secrets.IG_INSIGHTS_TOKEN && 'IG_INSIGHTS_TOKEN' || 'IG_PAGE_TOKEN' }}
        run: bash cloud/insights.sh
      - name: Save encrypted results
        run: |
          git config user.name "enovloom"
          git config user.email "349601991+enovloom@users.noreply.github.com"
          git add insights/latest.enc insights/latest.key
          git commit -m "insights: encrypted results"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
