name: insights

# Read-only: collects account and post numbers for analysis. Results are printed
# encrypted (see cloud/insights.sh), because this repository and its logs are public.
on:
  push:
    branches: [claude/instagram-analysis-fmnhog]
    paths: ['cloud/insights.sh', 'cloud/insights.pub.pem', 'cloud/insights.run', '.github/workflows/insights.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # skip the media files; only the scripts are needed
          sparse-checkout: cloud
          filter: blob:none
      - name: Fetch insights
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: bash cloud/insights.sh
