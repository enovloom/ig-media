name: insights

on:
  schedule:
    # once a day, a little after midnight JST, when yesterday's account numbers are complete
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # the media folder is large and not needed here
          sparse-checkout: |
            cloud
            queue
            stats
      - name: Record insights
        shell: pwsh
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: ./cloud/insights.ps1
      - name: Save results
        if: always()
        run: |
          git add -A stats
          if ! git diff --cached --quiet; then
            git config user.name "enovloom"
            git config user.email "349601991+enovloom@users.noreply.github.com"
            git commit -m "insights: update stats"
            git pull --rebase origin main
            git push
          fi
