name: autopost

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        shell: pwsh
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: ./cloud/publish.ps1
      - name: Save results
        if: always()
        run: |
          if [ -n "$(git status --porcelain queue/state.json)" ]; then
            git config user.name "enovloom"
            git config user.email "349601991+enovloom@users.noreply.github.com"
            git add queue/state.json
            git commit -m "autopost: update state"
            git pull --rebase origin main
            git push
          fi
